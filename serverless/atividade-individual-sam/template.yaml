AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Funcao serverless para gerar uma guia a partir de uma requisicao do Rota Vital.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 3
    MemorySize: 128

Resources:
  GerarGuiaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Events:
        GuiasApi:
          Type: Api
          Properties:
            Path: /guias
            Method: post
